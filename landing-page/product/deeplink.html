<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Open in Flean</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f7f7f7;
      color: #1a1a1a;
    }
    .card {
      text-align: center;
      padding: 32px 24px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e0e0e0;
      border-top-color: #2d6a4f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" aria-hidden="true"></div>
    <p id="message">Opening Flean…</p>
  </div>
  <script>
    (function () {
      var PLAY_STORE =
        'https://play.google.com/store/apps/details?id=ai.flean.shop&hl=en_IN';
      var APP_STORE =
        'https://apps.apple.com/in/app/flean-clean-food-nutrition/id6762185485';
      var HOME_DOWNLOAD = 'https://flean.ai/#download-flean-desktop';

      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var productId = pathParts.length >= 2 && pathParts[0] === 'product'
        ? decodeURIComponent(pathParts[1])
        : '';

      if (productId === 'deeplink.html') {
        productId = '';
      }

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

      if (productId) {
        var appLink = 'https://flean.ai/product/' + encodeURIComponent(productId);
        var meta = document.createElement('meta');
        meta.name = 'apple-itunes-app';
        meta.content = 'app-id=6762185485, app-argument=' + appLink;
        document.head.appendChild(meta);
      }

      function redirect(url) {
        window.location.replace(url);
      }

      if (!productId) {
        redirect(HOME_DOWNLOAD);
        return;
      }

      if (isAndroid) {
        var fallback = encodeURIComponent(PLAY_STORE);
        var intentUrl =
          'intent://flean.ai/product/' + encodeURIComponent(productId) +
          '#Intent;scheme=https;package=ai.flean.shop;S.browser_fallback_url=' +
          fallback + ';end';
        redirect(intentUrl);
        return;
      }

      if (isIOS) {
        window.setTimeout(function () {
          redirect(APP_STORE);
        }, 800);
        return;
      }

      redirect(HOME_DOWNLOAD);
    })();
  </script>
</body>
</html>
